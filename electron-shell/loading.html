<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(160deg, #0f766e, #0d9488);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
  }
  .wrap {
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    display: block;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  p {
    font-size: 13px;
    opacity: 0.85;
    margin: 0 0 22px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/icon.png" alt="PharmaCare" />
    <h1>PharmaCare</h1>
    <p>Starting up…</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
